name: Java

on: 
  push:
    branches:
      - 'features/**'
  paths:
    - 'java/src'
    - 'java/Dockerfile'
    - 'java/target/*.jar'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile
